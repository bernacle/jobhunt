[package]
name = "jobhunt-cli"
description = "The narrow command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "narrow"

[[bin]]
name = "narrow"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
futures.workspace = true
jobhunt-app.workspace = true
jobhunt-cloud.workspace = true
jobhunt-core.workspace = true
jobhunt-eligibility.workspace = true
jobhunt-jobs.workspace = true
jobhunt-mcp.workspace = true
jobhunt-profile.workspace = true
jobhunt-ranking.workspace = true
jobhunt-resume.workspace = true
jobhunt-sources.workspace = true
jobhunt-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
wiremock.workspace = true

[lints]
workspace = true
