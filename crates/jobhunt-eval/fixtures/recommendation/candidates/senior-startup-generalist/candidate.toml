id = "senior-startup-generalist"
summary = """
A synthetic senior engineer with about ten years of backend, platform and product-infrastructure work (TypeScript, Node, Go, AWS, Kubernetes as a user, PostgreSQL as an application database), mostly at small startups. Lives in Brazil, works remote only, won't relocate, authorized to work only in Brazil. Wants small technical teams, high ownership, startup or growth-stage companies; not early-career roles, and not roles far more specialized than their demonstrated work. The production failures were observed on a candidate like this one.
"""
unexpressed = [
    "Seniority floor: 'not early-career or new-grad roles'. The model has no level preference; seniority is only compared with the latest resume title, and 'Early Career' is not a level it reads.",
    "Specialization depth: 'not roles dramatically more specialized than my work'. Having used PostgreSQL or Kubernetes reads the same as building their internals.",
    "Engineering shape: product and platform generalist work vs research, database internals, low-latency trading.",
    "Ownership as a requirement rather than a keyword: a posting saying 'ownership' and a narrow maintenance role at a large enterprise are not told apart unless the posting states its size.",
    "Company shape beyond stated keywords: Anthropic, Stripe and Airbnb read as companies of unknown size unless their postings say otherwise.",
]

