# Pairs that share keywords but differ in one meaningful way. The side a
# candidate fits depends on the candidate: the same storage-engine role is a
# No for someone who used PostgreSQL and a Strong yes for someone who builds
# database engines. Companies are made up.

# --- PostgreSQL: using it heavily vs building its storage engine ---

[[job]]
id = "ledgerline-backend-postgres"
group = "contrastive"
pair = "postgres"
source = "ashby:ledgerline"
company = "Ledgerline"
title = "Senior Backend Engineer"
location = "Remote - Latin America"
workplace = "remote"
remote = true
employment = "full_time"
provenance = "synthetic"
compensation = { components = [{ kind = "salary", currency = "USD", min = 155000.0, max = 185000.0, interval = "year" }] }
description = """
About us
Ledgerline is a 30-person startup building bookkeeping software for small agencies.

About the role
Our product lives in PostgreSQL. You'll own the schema design, query performance, partitioning and logical replication for our application data, and the Node.js services on top of it. You will work on a small team with real ownership of what you ship.

What you'll need
- Strong experience with PostgreSQL in production applications: schema design, indexing, query tuning
- Strong experience with TypeScript and Node.js
- Experience with AWS

This role is remote and open to candidates in Latin America.
"""

