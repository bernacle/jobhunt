# Pay is a practicality, never a reason for fit: unknown pay must not hold a
# strong fit back, high pay must not rescue a weak one, pay below a floor
# doesn't change fit, and a range published for another location is not
# the candidate's. (The unknown-pay strong fit is `lanternfish-platform-no-pay`
# among the positive jobs; the golden Anthropic case is high pay on thin fit.)

[[job]]
id = "kestrel-staff-low-pay"
group = "compensation"
source = "ashby:kestrel"
company = "Kestrel"
title = "Staff Software Engineer, Product Infrastructure"
location = "Remote - Latin America"
workplace = "remote"
remote = true
employment = "full_time"
provenance = "synthetic"
compensation = { components = [{ kind = "salary", currency = "USD", min = 85000.0, max = 100000.0, interval = "year" }] }
description = """
About us
Kestrel is a 12-person startup building inventory software for independent bookshops.

About the role
You'll own our product infrastructure end to end on a small team: the API, the PostgreSQL database, the deploy pipeline and observability. Real ownership and a lot of autonomy.

What you'll need
- Strong experience with Go or TypeScript
- Experience with PostgreSQL and AWS

This role is remote and open to candidates in Latin America.
"""

