id = "quarrybird-senior-backend"
group = "positive"
source = "ashby:quarrybird"
company = "Quarrybird"
title = "Senior Backend Engineer"
location = "Remote - Latin America"
workplace = "remote"
remote = true
employment = "full_time"
provenance = "synthetic"
compensation = { components = [{ kind = "salary", currency = "USD", min = 160000.0, max = 190000.0, interval = "year" }] }
description = """
About us
Quarrybird is a 15-person startup building the freight-booking API that small logistics companies run on. We raised our Series A last year and are profitable on our core product.

About the role
You'll join a team of 6 engineers and own backend services end to end: API design, data model, deployment and on-call. There are no handoffs and no separate platform team; the people who build a service run it.

What you'll do
- Design and build services in TypeScript on Node.js
- Own our PostgreSQL schema and its performance
- Run what you build on AWS

What you'll need
- Several years of experience building backend systems in production
- Strong experience with TypeScript and Node.js
- Experience with PostgreSQL and AWS

This role is remote and open to candidates anywhere in Latin America.
"""

