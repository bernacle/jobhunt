[[job]]
id = "supabase-orioledb"
group = "golden"
observed_for = "senior-startup-generalist"
source = "ashby:supabase"
company = "Supabase"
title = "OrioleDB Developer"
location = "Remote"
workplace = "remote"
remote = true
employment = "full_time"
provenance = "paraphrased from a public Supabase posting"
description = """
About Supabase
Supabase is the Postgres development platform. We are a fully remote company with team members in more than 40 countries, and have raised over $1B, including our Series F.

About the role
OrioleDB is a new storage engine for PostgreSQL, built on PostgreSQL's table access method and extensibility APIs to bring a modern, cloud-native storage architecture: undo logging instead of vacuum, copy-on-write checkpoints and row-level write-ahead logging.

What you'll do
- Develop the OrioleDB storage engine: page layout, B-tree indexes, the buffer manager, recovery and replication
- Write PostgreSQL core patches and upstream them to the PostgreSQL community
- Profile and optimize concurrency and I/O paths

What you'll need
- Deep experience with the internals of PostgreSQL or another database engine
- Strong C programming skills and systems programming experience
- Understanding of storage engines, MVCC, write-ahead logging and crash recovery

Nice to have
- Contributions to PostgreSQL or another open-source database
- Experience with Rust

This role is open to candidates anywhere in the world.
"""

