description = """
Airbnb was born in 2007 when two hosts welcomed three guests to their San Francisco home, and has since grown to millions of hosts who have welcomed guests in almost every country.

The Community You Will Join
The Payments Platform team builds the systems that move money between guests and hosts in more than 190 countries.

The Difference You Will Make
This role is part of our Early Career program, for new graduates and engineers at the start of their careers. You will ramp up with a dedicated mentor and a structured onboarding curriculum, then ship backend features alongside senior engineers.

A Typical Day
- Build and maintain backend services in Java and Kotlin
- Write well-tested code and take part in code reviews
- Learn our service platform, data infrastructure and deployment tooling

Your Expertise
- A Bachelor's degree in Computer Science or a related field, completed or expected by 2027
- 0-2 years of professional software engineering experience, internships included
- Experience with Java, Kotlin or Python
- Familiarity with SQL databases such as PostgreSQL or MySQL

Your Location
This position is remote-eligible within Brazil.

Benefits
Paid time off, health insurance and a travel credit.
"""

