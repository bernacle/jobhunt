<div id="WaasShowJobPage-react-component-0" data-page="{&quot;component&quot;: &quot;WaasShowJobPage&quot;, &quot;props&quot;: {&quot;currentUser&quot;: null, &quot;company&quot;: {&quot;id&quot;: 13312, &quot;slug&quot;: &quot;posthog&quot;, &quot;name&quot;: &quot;PostHog&quot;, &quot;batch_name&quot;: &quot;W20&quot;, &quot;small_logo_url&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;one_liner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;website&quot;: &quot;https://www.posthog.com&quot;, &quot;long_description&quot;: &quot;PostHog helps engineers build better products. We provide everything they need to make sure they are building something that people want. This means - product analytics, session replays, feedback tools, feature flags, experimentation, LLM observability, and a data warehouse (with SQL) with one click data imports from the places you use.\r\n\r\nWe&#x27;ve been averaging ~10% monthly revenue growth, we are [default alive](http://www.paulgraham.com/aord.html), and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;tags&quot;: [&quot;Developer Tools&quot;, &quot;B2B&quot;, &quot;Open Source&quot;], &quot;ycdc_status&quot;: &quot;Active&quot;, &quot;logo_url&quot;: null, &quot;year_founded&quot;: 2020, &quot;team_size&quot;: 150, &quot;location&quot;: &quot;San Francisco&quot;, &quot;country&quot;: &quot;US&quot;, &quot;linkedin_url&quot;: null, &quot;twitter_url&quot;: null, &quot;fb_url&quot;: null, &quot;cb_url&quot;: null, &quot;show_founder_contact&quot;: false, &quot;hiring_description&quot;: &quot;PostHog is an open-source product analytics platform. We provide product-led teams with everything they need to understand user behavior, including funnels, session recording, user paths, multivariate testing, feature flags, heat maps, and more. PostHog can be deployed to the cloud, or self-hosted on existing infrastructure, removing the need to send data externally.\r\n\r\nPostHog was created as an open source project during Y Combinator&#x27;s W20 cohort and had the most successful B2B software launch on HackerNews since 2012 - with a product that was just 4 weeks old. Since then, more than 10,000 companies have installed the platform, we&#x27;ve had huge success with our paid upgrades, and we have raised $27m from some of the world&#x27;s top investors, and have shown strong product-led growth - 97% driven by word of mouth.\r\n\r\nDespite the  tech market, we&#x27;re default alive and doing better than ever!\r\n\r\nWe&#x27;ve been averaging &gt;20% monthly revenue growth, we are default alive, and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;founders&quot;: []}, &quot;job&quot;: {&quot;id&quot;: 110003, &quot;title&quot;: &quot;Finance Manager, Revenue Accounting&quot;, &quot;url&quot;: &quot;/companies/posthog/jobs/aZn60Nt-finance-manager-revenue-accounting&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D110003&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;location&quot;: &quot;Remote (US)&quot;, &quot;askUs&quot;: true, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;sales&quot;, &quot;roleSpecificType&quot;: null, &quot;prettyRole&quot;: &quot;Sales&quot;, &quot;salaryRange&quot;: &quot;&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;5+ years&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/posthog&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;companyName&quot;: &quot;PostHog&quot;, &quot;companyBatchName&quot;: &quot;W20&quot;, &quot;companyOneLiner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;10 days&quot;, &quot;lastActive&quot;: null, &quot;description&quot;: &quot;## About PostHog\n\nProduct development used to mean manually writing code, running analysis, diagnosing bugs, and rolling out changes using dozens of tools.\n\nPostHog makes products [self-driving](https://posthog.com/self-driving). It&#x27;s the only platform that acts like a co-pilot for you (and your AI agents) to do it all – autonomously.\n\nWe started with open-source product analytics, [&lt;u&gt;launched out of Y Combinator&#x27;s W20 cohort&lt;/u&gt;](https://posthog.com/handbook/story). We&#x27;ve since shipped [&lt;u&gt;more than a dozen products&lt;/u&gt;](https://posthog.com/products), including:\n\n- [PostHog Desktop](https://posthog.com/desktop), the only AI devtool that understands your product, not just your codebase.\n\n- [&lt;u&gt;A built-in data warehouse&lt;/u&gt;](https://posthog.com/docs/data-warehouse), so users can query product and customer data together using custom SQL insights.\n\n- [&lt;u&gt;PostHog AI&lt;/u&gt;](https://posthog.com/ai), an AI-powered analyst that answers product questions, helps users find useful session recordings, and writes custom SQL queries.\n\nWe are:\n\n1. **Product-led**. More than 450,000 organizations have installed PostHog, mostly driven by word-of-mouth. We have intensely strong product-market fit.\n\n2. [**&lt;u&gt;Default alive&lt;/u&gt;**](https://paulgraham.com/aord.html). Revenue is growing incredibly quickly, and we&#x27;re very efficient. We raise money to push ambition and grow faster, not to keep the lights on.\n\n3. **Well-funded.** We&#x27;ve raised more than $180m from some of the world&#x27;s top investors. We&#x27;re set up for a long, ambitious journey.\n\nWe&#x27;re focused on building an awesome product for end users, hiring exceptional teammates, shipping fast, and [&lt;u&gt;being as weird as possible&lt;/u&gt;](https://posthog.com/deskhog).\n\n&amp;nbsp;\n\n## Things we care about\n\n- **Transparency:** Everyone can read about our roadmap, how we pay (or even let go of) people, our strategy, and how we work, in our [&lt;u&gt;public company handbook&lt;/u&gt;](https://posthog.com/handbook). Internally, we share revenue, notes and slides from board meetings, and fundraising plans, so everyone has the context they need to make good decisions.\n\n- **Autonomy:** We don’t tell anyone what to do. Everyone chooses what to work on next based on what&#x27;s going to have the biggest impact on our customers, and what they find interesting and motivating to work on. [&lt;u&gt;Engineers lead product teams&lt;/u&gt;](https://posthog.com/handbook/wide-company) and [&lt;u&gt;make product decisions&lt;/u&gt;](https://posthog.com/handbook/which-products). Teams are flexible and easy to change when needed.\n\n- **Shipping fast:** [&lt;u&gt;Why not now?&lt;/u&gt;](https://posthog.com/handbook/values#why-not-now) We want to build a lot of products; we can&#x27;t do that shipping at a normal pace. We&#x27;ve built the company around small teams – autonomous, highly-efficient groups of [&lt;u&gt;cracked engineers&lt;/u&gt;](https://posthog.com/founders/cracked-manifesto) who can outship much larger companies because they own their products end-to-end.\n\n- **Time for building:** Nothing gets shipped in a meeting. We&#x27;re a natively remote company. We default to async communication – PRs \\&gt; Issues \\&gt; Slack. Tuesdays and Thursdays are [&lt;u&gt;meeting-free days&lt;/u&gt;](https://posthog.com/handbook/company/culture#were-on-the-makers-schedule), and we prioritize heads down building time over perfect coordination. This will be the most productive job you&#x27;ve ever had.\n\n- **Ambition:** We want to solve big problems. We strongly believe that aiming for the best possible upside, and sometimes missing, is better than never trying. We&#x27;re optimistic about what&#x27;s possible and our ability to get there.\n\n- **Being weird:** Weird means redesigning an already world-class website for the 5th time. It means shipping _literally_ every product that relates to customer data. It means building an [&lt;u&gt;objectively unnecessary developer toy&lt;/u&gt;](https://posthog.com/deskhog) with dubious shareholder value. Doing weird stuff is a competitive advantage. And it&#x27;s fun.\n\n## **Job Summary**\n\nPostHog bills on customer usage. This means we need to recognize revenue on usage basis. This involves figuring out what we actually earned and making sure the books show exactly that every month, on time, every time. And we need someone to own this entirely.\n\nYou’ll be expected to know where every dollar of revenue comes from, how it was recognized, why it was recognized that way, and exactly when it was collected. You’ve got plenty of company in tackling this with the finance team, the billing engineers and the revops team, all to ensure our GL tells the truth.\n\nIf you enjoy being in the weeds and seeing the direct impact of your work on a fast growing company, this could be the right fit for you.\n\n## **What you’ll be doing**\n\n- Own daily revenue accounting operations for usage based billing - journal entries, deferrals, recognition schedules, reconciliations, collections, tackling billing questions, the works. you’re responsible for ensuring every revenue transaction is recorded correctly and nothing falls through the cracks. Don’t let that daunt you - you’ll get plenty of support!\n\n- Execute the revenue side of month-end and year-end close - work collaboratively with the team to hit closing deadlines every month, co-own the checklist, track what’s outstanding - making sure we report accurate financials on time\n\n- Manage accounts receivable - handling collections, keeping cash flowing smoothly and answering any billing questions from Sales or customers\n\n- Support our annual financial audit - organize revenue related documentation, implement controls, and get audit workpapers ready. Help make the audit painless\n\n- Own the finance side of our billing/accounting integration - we’re going live with the new billing ledger model, and you’ll own integrating it with Campfire, our accounting ERP\n\n- Automate the boring stuff - finding opportunities to make our revenue accounting operations more efficient as we grow.\n\n- Bonus points if you like pineapple on pizza! 🍍🍕\n\n## **What you won&#x27;t be doing**\n\n❌ FP&amp;A\n\n❌ Strategic finance\n\n❌ Fundraising or investor relations.\n\n## **Requirements**\n\n- 5+ years of owning usage based revenue recognition experience in AI/SaaS companies\n\n- Strong working knowledge of GAAP and month-end/year-end close process\n\n- Comfortable working independently\n\n- Comfortable building processes and controls\n\n_Nice to haves_\n\n- Relevant education in accounting\n\n- Been through a financial audit\n\n_If you have a disability, please let us know if there&#x27;s any way we can make the interview process better for you - we&#x27;re happy to accommodate!_\n\n_#LI-DNI_\n\n&quot;, &quot;interview_process&quot;: null}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D110003&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/posthog&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/companies&quot;, &quot;customQuestions&quot;: []}, &quot;url&quot;: &quot;/companies/posthog/jobs/aZn60Nt-finance-manager-revenue-accounting&quot;, &quot;version&quot;: &quot;9fcde557260d98482e73fb068322d8b3020a10b3&quot;, &quot;encryptHistory&quot;: false, &quot;clearHistory&quot;: false, &quot;id&quot;: &quot;WaasShowJobPage-react-component-9f568d82-fe2d-4330-91db-3615ecd7b834&quot;, &quot;server_side&quot;: true}"></div>
