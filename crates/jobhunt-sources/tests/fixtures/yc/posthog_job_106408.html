<div id="WaasShowJobPage-react-component-0" data-page="{&quot;component&quot;: &quot;WaasShowJobPage&quot;, &quot;props&quot;: {&quot;currentUser&quot;: null, &quot;company&quot;: {&quot;id&quot;: 13312, &quot;slug&quot;: &quot;posthog&quot;, &quot;name&quot;: &quot;PostHog&quot;, &quot;batch_name&quot;: &quot;W20&quot;, &quot;small_logo_url&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;one_liner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;website&quot;: &quot;https://www.posthog.com&quot;, &quot;long_description&quot;: &quot;PostHog helps engineers build better products. We provide everything they need to make sure they are building something that people want. This means - product analytics, session replays, feedback tools, feature flags, experimentation, LLM observability, and a data warehouse (with SQL) with one click data imports from the places you use.\r\n\r\nWe&#x27;ve been averaging ~10% monthly revenue growth, we are [default alive](http://www.paulgraham.com/aord.html), and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;tags&quot;: [&quot;Developer Tools&quot;, &quot;B2B&quot;, &quot;Open Source&quot;], &quot;ycdc_status&quot;: &quot;Active&quot;, &quot;logo_url&quot;: null, &quot;year_founded&quot;: 2020, &quot;team_size&quot;: 150, &quot;location&quot;: &quot;San Francisco&quot;, &quot;country&quot;: &quot;US&quot;, &quot;linkedin_url&quot;: null, &quot;twitter_url&quot;: null, &quot;fb_url&quot;: null, &quot;cb_url&quot;: null, &quot;show_founder_contact&quot;: false, &quot;hiring_description&quot;: &quot;PostHog is an open-source product analytics platform. We provide product-led teams with everything they need to understand user behavior, including funnels, session recording, user paths, multivariate testing, feature flags, heat maps, and more. PostHog can be deployed to the cloud, or self-hosted on existing infrastructure, removing the need to send data externally.\r\n\r\nPostHog was created as an open source project during Y Combinator&#x27;s W20 cohort and had the most successful B2B software launch on HackerNews since 2012 - with a product that was just 4 weeks old. Since then, more than 10,000 companies have installed the platform, we&#x27;ve had huge success with our paid upgrades, and we have raised $27m from some of the world&#x27;s top investors, and have shown strong product-led growth - 97% driven by word of mouth.\r\n\r\nDespite the  tech market, we&#x27;re default alive and doing better than ever!\r\n\r\nWe&#x27;ve been averaging &gt;20% monthly revenue growth, we are default alive, and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;founders&quot;: []}, &quot;job&quot;: {&quot;id&quot;: 106408, &quot;title&quot;: &quot;ClickHouse Operations Engineer &quot;, &quot;url&quot;: &quot;/companies/posthog/jobs/g62MfF7-clickhouse-operations-engineer&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D106408&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;location&quot;: &quot;Remote (US)&quot;, &quot;askUs&quot;: false, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;eng&quot;, &quot;roleSpecificType&quot;: &quot;Full stack&quot;, &quot;prettyRole&quot;: &quot;Engineering&quot;, &quot;salaryRange&quot;: &quot;&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;Any (new grads ok)&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/posthog&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;companyName&quot;: &quot;PostHog&quot;, &quot;companyBatchName&quot;: &quot;W20&quot;, &quot;companyOneLiner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;about 1 month&quot;, &quot;lastActive&quot;: null, &quot;description&quot;: &quot;## About PostHog\n\nProduct development used to mean manually writing code, running analysis, diagnosing bugs, and rolling out changes using dozens of tools.\n\nPostHog makes products [self-driving](https://posthog.com/self-driving). It&#x27;s the only platform that acts like a co-pilot for you (and your AI agents) to do it all – autonomously.\n\nWe started with open-source product analytics, [&lt;u&gt;launched out of Y Combinator&#x27;s W20 cohort&lt;/u&gt;](https://posthog.com/handbook/story). We&#x27;ve since shipped [&lt;u&gt;more than a dozen products&lt;/u&gt;](https://posthog.com/products), including:\n\n- [PostHog Desktop](https://posthog.com/desktop), the only AI devtool that understands your product, not just your codebase.\n\n- [&lt;u&gt;A built-in data warehouse&lt;/u&gt;](https://posthog.com/docs/data-warehouse), so users can query product and customer data together using custom SQL insights.\n\n- [&lt;u&gt;PostHog AI&lt;/u&gt;](https://posthog.com/ai), an AI-powered analyst that answers product questions, helps users find useful session recordings, and writes custom SQL queries.\n\nWe are:\n\n1. **Product-led**. More than 450,000 organizations have installed PostHog, mostly driven by word-of-mouth. We have intensely strong product-market fit.\n\n2. [**&lt;u&gt;Default alive&lt;/u&gt;**](https://paulgraham.com/aord.html). Revenue is growing incredibly quickly, and we&#x27;re very efficient. We raise money to push ambition and grow faster, not to keep the lights on.\n\n3. **Well-funded.** We&#x27;ve raised more than $180m from some of the world&#x27;s top investors. We&#x27;re set up for a long, ambitious journey.\n\nWe&#x27;re focused on building an awesome product for end users, hiring exceptional teammates, shipping fast, and [&lt;u&gt;being as weird as possible&lt;/u&gt;](https://posthog.com/deskhog).\n\n&amp;nbsp;\n\n## Things we care about\n\n- **Transparency:** Everyone can read about our roadmap, how we pay (or even let go of) people, our strategy, and how we work, in our [&lt;u&gt;public company handbook&lt;/u&gt;](https://posthog.com/handbook). Internally, we share revenue, notes and slides from board meetings, and fundraising plans, so everyone has the context they need to make good decisions.\n\n- **Autonomy:** We don’t tell anyone what to do. Everyone chooses what to work on next based on what&#x27;s going to have the biggest impact on our customers, and what they find interesting and motivating to work on. [&lt;u&gt;Engineers lead product teams&lt;/u&gt;](https://posthog.com/handbook/wide-company) and [&lt;u&gt;make product decisions&lt;/u&gt;](https://posthog.com/handbook/which-products). Teams are flexible and easy to change when needed.\n\n- **Shipping fast:** [&lt;u&gt;Why not now?&lt;/u&gt;](https://posthog.com/handbook/values#why-not-now) We want to build a lot of products; we can&#x27;t do that shipping at a normal pace. We&#x27;ve built the company around small teams – autonomous, highly-efficient groups of [&lt;u&gt;cracked engineers&lt;/u&gt;](https://posthog.com/founders/cracked-manifesto) who can outship much larger companies because they own their products end-to-end.\n\n- **Time for building:** Nothing gets shipped in a meeting. We&#x27;re a natively remote company. We default to async communication – PRs \\&gt; Issues \\&gt; Slack. Tuesdays and Thursdays are [&lt;u&gt;meeting-free days&lt;/u&gt;](https://posthog.com/handbook/company/culture#were-on-the-makers-schedule), and we prioritize heads down building time over perfect coordination. This will be the most productive job you&#x27;ve ever had.\n\n- **Ambition:** We want to solve big problems. We strongly believe that aiming for the best possible upside, and sometimes missing, is better than never trying. We&#x27;re optimistic about what&#x27;s possible and our ability to get there.\n\n- **Being weird:** Weird means redesigning an already world-class website for the 5th time. It means shipping _literally_ every product that relates to customer data. It means building an [&lt;u&gt;objectively unnecessary developer toy&lt;/u&gt;](https://posthog.com/deskhog) with dubious shareholder value. Doing weird stuff is a competitive advantage. And it&#x27;s fun.\n\n## What you&#x27;ll be doing\n\nClickHouse is [the core piece of infrastructure at PostHog](https://posthog.com/docs/how-posthog-works/clickhouse). Every product and customer relies on it to ingest, store, and query data.\n\nWe need someone to automate, manage, and maintain ClickHouse as we grow towards capturing trillions of events per year and having one of the world’s largest clusters.\n\nThis includes ClickHouse operations and scaling infrastructure, as well as node and instance-level performance optimization. We want to ensure that we have the right hardware deployed at the right time for each workload on ClickHouse.\n\nYou&#x27;ll build systems and automations for the provisioning and scaling of our large ClickHouse clusters, handling over 100 PB&#x27;s of data. You&#x27;ll have the ability to investigate and experiment using the latest hardware that cloud providers have to offer in order to find the optimal setup for our solution. And yes, You&#x27;ll have a budget to do this.\n\nYou&#x27;ll be using Terraform, Ansible, and Kubernetes to automate the dynamic provisioning of instances and work on a bleeding edge ClickHouse implementation, like open format backed tables, and not just maintenance.  \nWe&#x27;re also building a query optimizer for ClickHouse, which means you will work on query performance tooling.\n\n## You’ll fit right in if:\n\n- **You bring OLAP Database Experience.** This role is focussed on ClickHouse, but if you bring strong experience with other OLAP Databases, that&#x27;s great. We&#x27;re looking for people that went into the internals of ClickHouse and other OLAP Databases, not high level users.\n\n- **You bring experience in automating Dynamic provisioning instances.** Strong experience with utilizing Terraform, Ansible and K8s is important.\n\n- **You bring experience with Scale and Complexity!** We&#x27;re building and operating high-scale complex data storage solutions, we need you to have experience with the challenges this brings.\n\n- **You bring the Stack we need.** We build using Python, Terraform, Ansible, Kubernetes, AWS, and Zookeeper (An alternative to Zookeeper is fine) \n\n- **You’re ready to do the best work of your career.** We have incredible distribution, a big financial cushion and an amazing team. There’s probably no better place to see how far you can go.\n\nIf this sounds like you, we should talk.\n\nWe are committed to ensuring a fair and accessible interview process. If you need any accommodations or adjustments, please let us know.\n\n## \n&quot;, &quot;interview_process&quot;: null}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D106408&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/posthog&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/companies&quot;, &quot;customQuestions&quot;: []}, &quot;url&quot;: &quot;/companies/posthog/jobs/g62MfF7-clickhouse-operations-engineer&quot;, &quot;version&quot;: &quot;9fcde557260d98482e73fb068322d8b3020a10b3&quot;, &quot;encryptHistory&quot;: false, &quot;clearHistory&quot;: false, &quot;id&quot;: &quot;WaasShowJobPage-react-component-d0d0eaef-a02f-4c92-b8f6-098f486e982b&quot;, &quot;server_side&quot;: true}"></div>
