<div id="WaasShowJobPage-react-component-0" data-page="{&quot;component&quot;: &quot;WaasShowJobPage&quot;, &quot;props&quot;: {&quot;currentUser&quot;: null, &quot;company&quot;: {&quot;id&quot;: 13312, &quot;slug&quot;: &quot;posthog&quot;, &quot;name&quot;: &quot;PostHog&quot;, &quot;batch_name&quot;: &quot;W20&quot;, &quot;small_logo_url&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;one_liner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;website&quot;: &quot;https://www.posthog.com&quot;, &quot;long_description&quot;: &quot;PostHog helps engineers build better products. We provide everything they need to make sure they are building something that people want. This means - product analytics, session replays, feedback tools, feature flags, experimentation, LLM observability, and a data warehouse (with SQL) with one click data imports from the places you use.\r\n\r\nWe&#x27;ve been averaging ~10% monthly revenue growth, we are [default alive](http://www.paulgraham.com/aord.html), and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;tags&quot;: [&quot;Developer Tools&quot;, &quot;B2B&quot;, &quot;Open Source&quot;], &quot;ycdc_status&quot;: &quot;Active&quot;, &quot;logo_url&quot;: null, &quot;year_founded&quot;: 2020, &quot;team_size&quot;: 150, &quot;location&quot;: &quot;San Francisco&quot;, &quot;country&quot;: &quot;US&quot;, &quot;linkedin_url&quot;: null, &quot;twitter_url&quot;: null, &quot;fb_url&quot;: null, &quot;cb_url&quot;: null, &quot;show_founder_contact&quot;: false, &quot;hiring_description&quot;: &quot;PostHog is an open-source product analytics platform. We provide product-led teams with everything they need to understand user behavior, including funnels, session recording, user paths, multivariate testing, feature flags, heat maps, and more. PostHog can be deployed to the cloud, or self-hosted on existing infrastructure, removing the need to send data externally.\r\n\r\nPostHog was created as an open source project during Y Combinator&#x27;s W20 cohort and had the most successful B2B software launch on HackerNews since 2012 - with a product that was just 4 weeks old. Since then, more than 10,000 companies have installed the platform, we&#x27;ve had huge success with our paid upgrades, and we have raised $27m from some of the world&#x27;s top investors, and have shown strong product-led growth - 97% driven by word of mouth.\r\n\r\nDespite the  tech market, we&#x27;re default alive and doing better than ever!\r\n\r\nWe&#x27;ve been averaging &gt;20% monthly revenue growth, we are default alive, and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;founders&quot;: []}, &quot;job&quot;: {&quot;id&quot;: 109574, &quot;title&quot;: &quot;Security Engineer &quot;, &quot;url&quot;: &quot;/companies/posthog/jobs/678x9ca-security-engineer&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D109574&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;location&quot;: &quot;Remote (US)&quot;, &quot;askUs&quot;: false, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;eng&quot;, &quot;roleSpecificType&quot;: &quot;Full stack&quot;, &quot;prettyRole&quot;: &quot;Engineering&quot;, &quot;salaryRange&quot;: &quot;&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;Any (new grads ok)&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/posthog&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;companyName&quot;: &quot;PostHog&quot;, &quot;companyBatchName&quot;: &quot;W20&quot;, &quot;companyOneLiner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;13 days&quot;, &quot;lastActive&quot;: null, &quot;description&quot;: &quot;## About PostHog\n\nProduct development used to mean manually writing code, running analysis, diagnosing bugs, and rolling out changes using dozens of tools.\n\nPostHog makes products [self-driving](https://posthog.com/self-driving). It&#x27;s the only platform that acts like a co-pilot for you (and your AI agents) to do it all – autonomously.\n\nWe started with open-source product analytics, [&lt;u&gt;launched out of Y Combinator&#x27;s W20 cohort&lt;/u&gt;](https://posthog.com/handbook/story). We&#x27;ve since shipped [&lt;u&gt;more than a dozen products&lt;/u&gt;](https://posthog.com/products), including:\n\n- [PostHog Desktop](https://posthog.com/desktop), the only AI devtool that understands your product, not just your codebase.\n\n- [&lt;u&gt;A built-in data warehouse&lt;/u&gt;](https://posthog.com/docs/data-warehouse), so users can query product and customer data together using custom SQL insights.\n\n- [&lt;u&gt;PostHog AI&lt;/u&gt;](https://posthog.com/ai), an AI-powered analyst that answers product questions, helps users find useful session recordings, and writes custom SQL queries.\n\nWe are:\n\n1. **Product-led**. More than 450,000 organizations have installed PostHog, mostly driven by word-of-mouth. We have intensely strong product-market fit.\n\n2. [**&lt;u&gt;Default alive&lt;/u&gt;**](https://paulgraham.com/aord.html). Revenue is growing incredibly quickly, and we&#x27;re very efficient. We raise money to push ambition and grow faster, not to keep the lights on.\n\n3. **Well-funded.** We&#x27;ve raised more than $180m from some of the world&#x27;s top investors. We&#x27;re set up for a long, ambitious journey.\n\nWe&#x27;re focused on building an awesome product for end users, hiring exceptional teammates, shipping fast, and [&lt;u&gt;being as weird as possible&lt;/u&gt;](https://posthog.com/deskhog).\n\n## **Things we care about**\n\n- **Transparency:** Everyone can read about our roadmap, how we pay (or even let go of) people, our strategy, and how we work, in our[&lt;u&gt;public company handbook&lt;/u&gt;](https://posthog.com/handbook). Internally, we share revenue, notes and slides from board meetings, and fundraising plans, so everyone has the context they need to make good decisions.\n\n- **Autonomy:** We don’t tell anyone what to do. Everyone chooses what to work on next based on what&#x27;s going to have the biggest impact on our customers, and what they find interesting and motivating to work on.[&lt;u&gt;Engineers lead product teams&lt;/u&gt;](https://posthog.com/handbook/wide-company) and[&lt;u&gt;make product decisions&lt;/u&gt;](https://posthog.com/handbook/which-products). Teams are flexible and easy to change when needed.\n\n- **Shipping fast:** [&lt;u&gt;Why not now?&lt;/u&gt;](https://posthog.com/handbook/values#why-not-now) We want to build a lot of products; we can&#x27;t do that shipping at a normal pace. We&#x27;ve built the company around small teams – autonomous, highly-efficient groups of[&lt;u&gt;cracked engineers&lt;/u&gt;](https://posthog.com/founders/cracked-manifesto) who can outship much larger companies because they own their products end-to-end.\n\n- **Time for building:** Nothing gets shipped in a meeting. We&#x27;re a natively remote company. We default to async communication – PRs \\&gt; Issues \\&gt; Slack. Tuesdays and Thursdays are[&lt;u&gt;meeting-free days&lt;/u&gt;](https://posthog.com/handbook/company/culture#were-on-the-makers-schedule), and we prioritize heads down building time over perfect coordination. This will be the most productive job you&#x27;ve ever had.\n\n- **Ambition:** We want to solve big problems. We strongly believe that aiming for the best possible upside, and sometimes missing, is better than never trying. We&#x27;re optimistic about what&#x27;s possible and our ability to get there.\n\n- **Being weird:** Weird means redesigning an already world-class website for the 5th time. It means shipping _literally_ every product that relates to customer data. It means building an[&lt;u&gt;objectively unnecessary developer toy&lt;/u&gt;](https://posthog.com/deskhog) with dubious shareholder value. Doing weird stuff is a competitive advantage. And it&#x27;s fun.\n\n## **Who we&#x27;re looking for**\n\nWe are looking for an expert security generalist (in EU/UK) to assist with all things security at PostHog. Someone equally adept (and interested!) in building secure libraries, writing semgrep rules, hardening cloud deployments, improving network observability, and leading incident response.\n\nSomeone to take the reins of our security operations, build out our detection pipelines, and ensure that when something goes bump in the night, we have the observability to know exactly what happened.   \n  \nWe&#x27;re a team that&#x27;s building internal security products and agents - things like agents to automatically triage wiz alerts, automatically review pull requests, automatically assign vulnerability findings to the owning product team.\n\nIn this role you’ll:\n\n- **Build from Scratch:** You aren&#x27;t maintaining someone else&#x27;s legacy SIEM. You are shaping the security team, culture and tooling for a high-growth, open-source company.\n\n- **Zero Bureaucracy:** We hate meetings. We don&#x27;t have \&quot;Security Committees.\&quot; You have the autonomy to make changes and move fast.\n\n- **Transparency:** We work in the open. You’ll be able to see (and contribute to) how we handled past incidents, like this[&lt;u&gt;NPM package compromise&lt;/u&gt;](https://www.google.com/search?q=https://github.com/PostHog/posthog/issues/example).\n\n- **Direct Impact:** Your work directly protects the data of thousands of customers. When you improve our security posture, the whole company (and our community) feels it.\n\n## **What you&#x27;ll be doing**\n\n- **Triage and Tune:** You’ll own our Wiz alerts. You’ll be responsible for turning \&quot;noise\&quot; into \&quot;actionable findings\&quot; and ensuring we aren&#x27;t just staring at a dashboard of issues that don&#x27;t actually matter. We already get relatively few alerts, and we’d like to even further reduce that to just the ones that matter.\n\n- **Incident detection, response:** You’ll lead the charge on security incidents. Whether it’s a compromised NPM package or a suspicious IAM pattern, you’ll help coordinate the response and lead the post-mortem. You’ll also help build our IR runbooks.\n\n- **Build Observability:** You’ll build detection pipelines, and close our network-based observability gaps. We want to be able to trace network requests and suspicious activity all the way back to specific code paths.\n\n- **Threat Hunting:** You’ll proactively hunt for threats in our AWS environment. You won&#x27;t just wait for an alert; you&#x27;ll define what \&quot;good\&quot; looks like and build the telemetry to prove it.\n\n- **The VDP:** You’ll support our Vulnerability Disclosure Program, triaging reports from researchers and eventually transitioning us toward a formal bug bounty program.\n\n- **Enable the Team:** You’ll support our product squads with threat modeling and secure design reviews. &lt;u&gt;We don&#x27;t do \&quot;Security says no\&quot;; we do \&quot;Security says &#x27;here is how to do this safely.&lt;/u&gt;&#x27;\&quot;\n\n- **Help build our security culture:** Our engineers trust the security team and view security as an enabler. You’ll be a crucial part of helping to continue this excellent (and uncommon) working relationship.\n\nWhile this is not a Corporate security (MDM, endpoint, device trust) or Supply chain/CI-CD hardening role, in true PostHog style, there are opportunities to work on these as well.\n\n&amp;nbsp;\n\n## Requirements\n\n- **Cloud Native:** You have 3-5+ years of experience in security engineering with a heavy focus on AWS. You know your way around IAM, VPC logs, and CloudTrail like the back of your hand.\n\n- **Detection Specialist:** You’ve used CSPM/CNAPP tools (like Wiz or Prisma) and, more importantly, you know how to build detection pipelines that engineers actually trust.\n\n- **Battle-Tested:** You’ve led incident response before. You’re calm under pressure and know how to coordinate across teams to contain a threat.\n\n- **High Autonomy:** We don’t have a security SOC. You’ll be building this function from scratch, so you need to be comfortable deciding what’s important and executing on it without a manual.\n\n- **Engineering skills:** You bring strong engineering experience and next to digging into code to understand an exploit or a vulnerability, you can write code with the same proficiency as our product engineers.\n\n- **Communication and attitude:** As mentioned before we don&#x27;t do \&quot;Security says no\&quot;, we do \&quot;Security says &#x27;here is how to do this safely.” This is crucial for us, we need people that want to enable engineers and work with them, not limit them.\n\n## Nice to Have\n\n- **Incident management:** Strong experience with incident response/incident detection\n\n_We are committed to ensuring a fair and accessible interview process. If you need any accommodations or adjustments, please let us know_\n\n_#LI-DNI_\n\n&quot;, &quot;interview_process&quot;: null}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D109574&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/posthog&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/companies&quot;, &quot;customQuestions&quot;: []}, &quot;url&quot;: &quot;/companies/posthog/jobs/678x9ca-security-engineer&quot;, &quot;version&quot;: &quot;9fcde557260d98482e73fb068322d8b3020a10b3&quot;, &quot;encryptHistory&quot;: false, &quot;clearHistory&quot;: false, &quot;id&quot;: &quot;WaasShowJobPage-react-component-adb0d493-a2de-4f58-a4b1-7830c17a6f38&quot;, &quot;server_side&quot;: true}"></div>
