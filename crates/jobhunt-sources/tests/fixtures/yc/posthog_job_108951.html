<div id="WaasShowJobPage-react-component-0" data-page="{&quot;component&quot;: &quot;WaasShowJobPage&quot;, &quot;props&quot;: {&quot;currentUser&quot;: null, &quot;company&quot;: {&quot;id&quot;: 13312, &quot;slug&quot;: &quot;posthog&quot;, &quot;name&quot;: &quot;PostHog&quot;, &quot;batch_name&quot;: &quot;W20&quot;, &quot;small_logo_url&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;one_liner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;website&quot;: &quot;https://www.posthog.com&quot;, &quot;long_description&quot;: &quot;PostHog helps engineers build better products. We provide everything they need to make sure they are building something that people want. This means - product analytics, session replays, feedback tools, feature flags, experimentation, LLM observability, and a data warehouse (with SQL) with one click data imports from the places you use.\r\n\r\nWe&#x27;ve been averaging ~10% monthly revenue growth, we are [default alive](http://www.paulgraham.com/aord.html), and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;tags&quot;: [&quot;Developer Tools&quot;, &quot;B2B&quot;, &quot;Open Source&quot;], &quot;ycdc_status&quot;: &quot;Active&quot;, &quot;logo_url&quot;: null, &quot;year_founded&quot;: 2020, &quot;team_size&quot;: 150, &quot;location&quot;: &quot;San Francisco&quot;, &quot;country&quot;: &quot;US&quot;, &quot;linkedin_url&quot;: null, &quot;twitter_url&quot;: null, &quot;fb_url&quot;: null, &quot;cb_url&quot;: null, &quot;show_founder_contact&quot;: false, &quot;hiring_description&quot;: &quot;PostHog is an open-source product analytics platform. We provide product-led teams with everything they need to understand user behavior, including funnels, session recording, user paths, multivariate testing, feature flags, heat maps, and more. PostHog can be deployed to the cloud, or self-hosted on existing infrastructure, removing the need to send data externally.\r\n\r\nPostHog was created as an open source project during Y Combinator&#x27;s W20 cohort and had the most successful B2B software launch on HackerNews since 2012 - with a product that was just 4 weeks old. Since then, more than 10,000 companies have installed the platform, we&#x27;ve had huge success with our paid upgrades, and we have raised $27m from some of the world&#x27;s top investors, and have shown strong product-led growth - 97% driven by word of mouth.\r\n\r\nDespite the  tech market, we&#x27;re default alive and doing better than ever!\r\n\r\nWe&#x27;ve been averaging &gt;20% monthly revenue growth, we are default alive, and we didn&#x27;t raised a huge / now-overpriced round in 2021. While others are focused on layoffs and struggling to grow into huge valuations, we&#x27;re focusing on an awesome product for end users, hiring (a handful of) exceptional team members and seeing fantastic increases in revenue as a result.\r\n\r\nCheck out posthog.com/careers if you want to be part of this journey.&quot;, &quot;founders&quot;: []}, &quot;job&quot;: {&quot;id&quot;: 108951, &quot;title&quot;: &quot;Technical Staff Writer (Blogs &amp; Newsletters)&quot;, &quot;url&quot;: &quot;/companies/posthog/jobs/z8Z2WWd-technical-staff-writer-blogs-newsletters&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D108951&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;location&quot;: &quot;Remote (US)&quot;, &quot;askUs&quot;: false, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;operations&quot;, &quot;roleSpecificType&quot;: null, &quot;prettyRole&quot;: &quot;Operations&quot;, &quot;salaryRange&quot;: &quot;&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;8+ years&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/posthog&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/7f1b6d1787ae32a7ebc0d417ec6fb8a204a3bbe9.png&quot;, &quot;companyName&quot;: &quot;PostHog&quot;, &quot;companyBatchName&quot;: &quot;W20&quot;, &quot;companyOneLiner&quot;: &quot;The single platform to analyze, test, observe, and deploy new features&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;16 days&quot;, &quot;lastActive&quot;: null, &quot;description&quot;: &quot;## About PostHog\n\nProduct development used to mean manually writing code, running analysis, diagnosing bugs, and rolling out changes using dozens of tools.\n\nPostHog makes products [self-driving](https://posthog.com/self-driving). It&#x27;s the only platform that acts like a co-pilot for you (and your AI agents) to do it all – autonomously.\n\nWe started with open-source product analytics, [&lt;u&gt;launched out of Y Combinator&#x27;s W20 cohort&lt;/u&gt;](https://posthog.com/handbook/story). We&#x27;ve since shipped [&lt;u&gt;more than a dozen products&lt;/u&gt;](https://posthog.com/products), including:\n\n- [PostHog Desktop](https://posthog.com/desktop), the only AI devtool that understands your product, not just your codebase.\n\n- [&lt;u&gt;A built-in data warehouse&lt;/u&gt;](https://posthog.com/docs/data-warehouse), so users can query product and customer data together using custom SQL insights.\n\n- [&lt;u&gt;PostHog AI&lt;/u&gt;](https://posthog.com/ai), an AI-powered analyst that answers product questions, helps users find useful session recordings, and writes custom SQL queries.\n\nWe are:\n\n1. **Product-led**. More than 450,000 organizations have installed PostHog, mostly driven by word-of-mouth. We have intensely strong product-market fit.\n\n2. [**&lt;u&gt;Default alive&lt;/u&gt;**](https://paulgraham.com/aord.html). Revenue is growing incredibly quickly, and we&#x27;re very efficient. We raise money to push ambition and grow faster, not to keep the lights on.\n\n3. **Well-funded.** We&#x27;ve raised more than $180m from some of the world&#x27;s top investors. We&#x27;re set up for a long, ambitious journey.\n\nWe&#x27;re focused on building an awesome product for end users, hiring exceptional teammates, shipping fast, and [&lt;u&gt;being as weird as possible&lt;/u&gt;](https://posthog.com/deskhog).\n\n&amp;nbsp;\n\n## Things we care about\n\n- **Transparency:** Everyone can read about our roadmap, how we pay (or even let go of) people, our strategy, and how we work, in our [&lt;u&gt;public company handbook&lt;/u&gt;](https://posthog.com/handbook). Internally, we share revenue, notes and slides from board meetings, and fundraising plans, so everyone has the context they need to make good decisions.\n\n- **Autonomy:** We don’t tell anyone what to do. Everyone chooses what to work on next based on what&#x27;s going to have the biggest impact on our customers, and what they find interesting and motivating to work on. [&lt;u&gt;Engineers lead product teams&lt;/u&gt;](https://posthog.com/handbook/wide-company) and [&lt;u&gt;make product decisions&lt;/u&gt;](https://posthog.com/handbook/which-products). Teams are flexible and easy to change when needed.\n\n- **Shipping fast:** [&lt;u&gt;Why not now?&lt;/u&gt;](https://posthog.com/handbook/values#why-not-now) We want to build a lot of products; we can&#x27;t do that shipping at a normal pace. We&#x27;ve built the company around small teams – autonomous, highly-efficient groups of [&lt;u&gt;cracked engineers&lt;/u&gt;](https://posthog.com/founders/cracked-manifesto) who can outship much larger companies because they own their products end-to-end.\n\n- **Time for building:** Nothing gets shipped in a meeting. We&#x27;re a natively remote company. We default to async communication – PRs \\&gt; Issues \\&gt; Slack. Tuesdays and Thursdays are [&lt;u&gt;meeting-free days&lt;/u&gt;](https://posthog.com/handbook/company/culture#were-on-the-makers-schedule), and we prioritize heads down building time over perfect coordination. This will be the most productive job you&#x27;ve ever had.\n\n- **Ambition:** We want to solve big problems. We strongly believe that aiming for the best possible upside, and sometimes missing, is better than never trying. We&#x27;re optimistic about what&#x27;s possible and our ability to get there.\n\n- **Being weird:** Weird means redesigning an already world-class website for the 5th time. It means shipping _literally_ every product that relates to customer data. It means building an [&lt;u&gt;objectively unnecessary developer toy&lt;/u&gt;](https://posthog.com/deskhog) with dubious shareholder value. Doing weird stuff is a competitive advantage. And it&#x27;s fun.\n\n## **Who we’re looking for and why now?**\n\nA great writer who gets technical stuff – and loves figuring out how to explain it to other people.\n\nWe have a strong writing culture, and writing as marketing has worked ridiculously well for us. We have a [&lt;u&gt;newsletter&lt;/u&gt;](https://posthog.com/newsletter) with over 100k subscribers, active social accounts, and real SEO and AEO authority. Hundreds of thousands of people visit our website every day. If you join, you won&#x27;t spend a year building an audience before anyone reads you.\n\n[&lt;u&gt;We can and like to be opinionated&lt;/u&gt;](https://newsletter.posthog.com/p/collaboration-sucks) about what we think best practice is and thousands of developers look to us to provide them opinion.\n\nThe problem is we&#x27;re at capacity, and there&#x27;s a long list of content we&#x27;re neglecting because of it. We used to do more tutorials. Use case guides people keep asking us for.\n\nOverall, we have a lot to write about. PostHog has grown from product analytics into a broad platform for engineers, and we&#x27;re building everything from AI agents and error tracking to data infrastructure at huge scale. We&#x27;re also open by default, so we&#x27;re unusually happy to share what we&#x27;ve learned along the way.\n\nWe want someone who can turn all of that into genuinely useful technical content.\n\nSimply put, **you&#x27;re a writer**. You care about the craft, have opinions about what makes technical content actually great, and have a portfolio that proves it.\n\n## **What you’ll be doing**\n\n&lt;u&gt;Disclaimer&lt;/u&gt;: we keep getting applications from excellent technical documentation writers who have no technical blog posts portfolio. This isn&#x27;t that job though.\n\nThe work here is **blog posts**.\n\nYou&#x27;ll research and explain use cases, technical concepts, and how things actually work. One day that might mean digging into how our engineers rebuilt part of our data warehouse. Another could be explaining the difference between logs and traces, writing a tutorial for a PostHog use case, or figuring out the best way to explain what a context warehouse is.\n\nYou&#x27;ll need to be comfortable getting into technical details, but you don&#x27;t need to be an engineer. The important bit is that you&#x27;re curious enough to understand technical concepts properly and a good enough writer to explain them simply.\n\nDay to day, it looks like:\n\n- **Writing content that helps people and agents use PostHog better.** Blog posts in the form of uUse case guides, tutorials, technical explainers, engineering posts. The stuff we know is valuable and haven&#x27;t had the capacity to do as much as we want to.\n\n- **Researching and explaining hard things.** Technical details, engineering processes, and concepts that most people gloss over. Going deep enough that a builder actually learns something.\n\n- **Figuring out what to write.** Looking at what we are shipping as a company, what our priorities are, and what&#x27;s interesting to decide yourself. There isn&#x27;t going to be someone telling you what to write all the time.\n\n- **Choosing the right format for the idea.** Sometimes that&#x27;s an engineering blog. Sometimes it&#x27;s an SEO explainer. Sometimes it&#x27;s a thread on X.\n\n- **Working with engineers and other marketers.** Getting the story of what they built, why it matters, and what&#x27;s interesting about it for normal builders. You might edit their blog posts too.\n\nSome examples of the sort of things you might work on:\n\n- [&lt;u&gt;10,000 PRs a month is easy: How devex is evolving at PostHog&lt;/u&gt;](https://posthog.com/blog/10k-prs-a-month)\n\n- [&lt;u&gt;What is a context warehouse?&lt;/u&gt;](https://posthog.com/blog/what-is-a-context-warehouse)\n\n- [&lt;u&gt;Why we rebuilt our data warehouse on DuckDB over ClickHouse&lt;/u&gt;](https://posthog.com/blog/why-we-rebuilt-our-data-warehouse)\n\n- [&lt;u&gt;What is a Scout? A technical deep dive&lt;/u&gt;](https://posthog.com/blog/what-is-a-scout)\n\n- [&lt;u&gt;What is distributed tracing? (A guide for engineers)&lt;/u&gt;](https://posthog.com/product-engineers/what-is-distributed-tracing)\n\n- [&lt;u&gt;Validating what you ship: Did anyone use it? Did it work?&lt;/u&gt;](https://posthog.com/tutorials/validating-what-you-ship)\n\n- [&lt;u&gt;How to set up embedded analytics&lt;/u&gt;](https://posthog.com/tutorials/embedded-analytics)\n\n**Go and read at least two or three of those before you apply.** If that&#x27;s not the kind of thing you want to spend your week writing, this isn&#x27;t the job, and we&#x27;d both rather find that out now&lt;u&gt;.&lt;/u&gt;\n\n## **What you won’t be doing**\n\n❌ Writing [&lt;u&gt;docs&lt;/u&gt;.](https://posthog.com/docs) This is not a traditional Technical Writer, or Documentation Engineer, or UX Writer role. [&lt;u&gt;Wizard &amp;amp; Docs&lt;/u&gt;](https://posthog.com/teams/wizard-and-docs) team owns that, and they’re excellent at it.\n\n❌ Churning out generic SEO content to hit a publishing quota.\n\n❌ Spending most of your time writing social posts, ads, video scripts, or marketing copy.\n\n❌ Waiting for someone to tell you exactly what to write every week.\n\n❌ Publishing AI slop nobody on the team would actually want to read.\n\n❌ Running the newsletter as your main job. The newsletter goes out to 100k+ people and you&#x27;ll write for it, but it&#x27;s downstream of the posts. If your dream job is editing a newsletter, this isn&#x27;t it.\n\n## **You’ll fit right in if:**\n\n- **You&#x27;re a strong writer.** This is the most important requirement. You can take something complicated and make it clear, useful, and enjoyable to read. You’re dedicated to the craft of writing. Every post here gets reviewed and we only publish things we&#x27;re proud of. You need to share the same sentiment.\n\n- **You&#x27;ve written technical content before.** Your portfolio includes technical explainers, engineering posts, tutorials, or similar work for a developer audience – similar to the ones we want to write (check the samples above!). Ideally, you&#x27;ve written these across styles, concepts, and mediums (SEO blogs, X threads).\n\n- **You&#x27;re technically curious and capable.** You don&#x27;t need to be an engineer, but concepts like logs and traces, data warehouses, APIs, LLMs, and agents shouldn&#x27;t scare you. You should be able to learn how something works and explain it accurately.\n\n- **You have good taste.** You know the difference between content that genuinely teaches someone something and content that exists because somebody wanted to rank for a keyword.\n\n- **You’re AI-pilled.** You use AI in your own work to build cool things, improve your workflows, and help you write great content.\n\n- **You work independently.** There&#x27;s rarely a queue of perfectly scoped assignments at PostHog. You&#x27;ll need to decide what&#x27;s worth writing, develop a point of view, and get it shipped.\n\n## **Nice to haves**\n\n- **You&#x27;ve done this at a similar company.** Developer tools, B2B SaaS, or anywhere with a technical audience. If you&#x27;ve written high-quality technical explainers for a company like ours before, you&#x27;re exactly who we&#x27;re looking for.\n\n- **You ship things.** Side projects, small tools, anything that means you&#x27;ve been on the other side of the docs you&#x27;re writing.\n\n- **You already use PostHog.** Not necessary, but useful. We use it for everything.  \n\n_If you have a disability, please let us know if there&#x27;s any way we can make the interview process better for you – we&#x27;re happy to accommodate!_\n\n_#LI-DNI_\n\n&quot;, &quot;interview_process&quot;: null}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D108951&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=13312&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/posthog&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/companies&quot;, &quot;customQuestions&quot;: []}, &quot;url&quot;: &quot;/companies/posthog/jobs/z8Z2WWd-technical-staff-writer-blogs-newsletters&quot;, &quot;version&quot;: &quot;9fcde557260d98482e73fb068322d8b3020a10b3&quot;, &quot;encryptHistory&quot;: false, &quot;clearHistory&quot;: false, &quot;id&quot;: &quot;WaasShowJobPage-react-component-6edf02c1-f626-4c84-9ab3-38227edc8231&quot;, &quot;server_side&
