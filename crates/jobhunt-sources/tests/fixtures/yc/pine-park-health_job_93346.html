<div id="WaasShowJobPage-react-component-0" data-page="{&quot;component&quot;: &quot;WaasShowJobPage&quot;, &quot;props&quot;: {&quot;currentUser&quot;: null, &quot;company&quot;: {&quot;id&quot;: 1965, &quot;slug&quot;: &quot;pine-park-health&quot;, &quot;name&quot;: &quot;Pine Park Health&quot;, &quot;batch_name&quot;: &quot;S18&quot;, &quot;small_logo_url&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/3facf7f7379345c5f8e16d3059db45980ba0aa68.png&quot;, &quot;one_liner&quot;: &quot;We provide primary care in senior living communities.&quot;, &quot;website&quot;: &quot;http://pineparkhealth.com&quot;, &quot;long_description&quot;: &quot;We&#x27;re a primary care practice that helps residents of senior living communities lead healthier, happy lives.\r\n\r\nOur mission is to keep senior living residents healthy—by keeping them away from hospitals where exposure to health risks is high. Through our new clinical care delivery model, we bring clinicians right into senior living communities, providing safer, more convenient primary care. Pine Park partners with senior living communities to provide primary care to their residents, building a value-based care model where we keep patients healthier. This allows us to provide comprehensive healthcare on-site, see patients regularly, and better support their holistic health.&quot;, &quot;tags&quot;: [&quot;Healthcare&quot;], &quot;ycdc_status&quot;: &quot;Active&quot;, &quot;logo_url&quot;: null, &quot;year_founded&quot;: 2018, &quot;team_size&quot;: 75, &quot;location&quot;: &quot;San Francisco&quot;, &quot;country&quot;: &quot;US&quot;, &quot;linkedin_url&quot;: null, &quot;twitter_url&quot;: null, &quot;fb_url&quot;: null, &quot;cb_url&quot;: null, &quot;show_founder_contact&quot;: false, &quot;hiring_description&quot;: &quot;Pine Park Health opens clinics in assisted living communities and uses technology to keep residents healthy. &quot;, &quot;founders&quot;: []}, &quot;job&quot;: {&quot;id&quot;: 93346, &quot;title&quot;: &quot;Senior Software Engineer&quot;, &quot;url&quot;: &quot;/companies/pine-park-health/jobs/wx8rhlj-senior-software-engineer&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D93346&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=1965&quot;, &quot;location&quot;: &quot;Berkeley, CA, US / Remote (San Francisco, CA, US; Berkeley, CA, US; Oakland, CA, US; Fremont, CA, US; Hayward, CA, US)&quot;, &quot;askUs&quot;: true, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;eng&quot;, &quot;roleSpecificType&quot;: &quot;Full stack&quot;, &quot;prettyRole&quot;: &quot;Engineering&quot;, &quot;salaryRange&quot;: &quot;$190K - $215K&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;6+ years&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [&quot;Google Cloud&quot;, &quot;Node.js&quot;, &quot;PostgreSQL&quot;, &quot;React&quot;, &quot;TypeScript&quot;], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/pine-park-health&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/3facf7f7379345c5f8e16d3059db45980ba0aa68.png&quot;, &quot;companyName&quot;: &quot;Pine Park Health&quot;, &quot;companyBatchName&quot;: &quot;S18&quot;, &quot;companyOneLiner&quot;: &quot;We provide primary care in senior living communities.&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;5 months&quot;, &quot;lastActive&quot;: &quot;1 day&quot;, &quot;description&quot;: &quot;### **About the Role**\n\nPine Park Health brings doctors and nurses to seniors where they live. We&#x27;re backed by YC, First Round Capital, Gradient Ventures (Google), Averin Canvas, Foundation, Liquid 2, Box Group, and others, and we&#x27;re based in the Bay Area.\n\nPine Park has three stacked parts:\n\n* First, it is a service business. We hire doctors and send them each week to see frail seniors in their apartments, so they don’t have to travel to clinics or hospitals for primary care.\n* Second, because house calls are expensive, we build software to make them cheap enough to scale. The software reads patient data, triages issues, handles faxes, schedules visits, orders labs, manages referrals, checks in on patients, and runs follow-up. \n* Third, we have a business model that makes the first two work. We partner with Medicare and Medicare Advantage so they give us a fixed budget per patient per year based on expected medical spending. If we keep patients healthier and their total spending comes in below that budget, we keep the difference. \n\nThat allows us to run a primary care practice that makes money by pulling cost out of the most expensive parts of the system, especially hospitals.\n\n \\\n**What This Looks Like Day-to-Day**\n\nThe Senior Software Engineer role at Pine Park Health is 60% product and 40% engineering. So if you’re looking for a startup where you just write code, Pine Park Health is not the right fit.\n\n* You’ll receive a key business problem to solve, with specific test criteria for whether that problem is solved. Then you’ll be responsible for owning that problem all the way through.\n*  That means spending time shadowing and interviewing doctors, nurses, medical assistants, and patients. It means documenting their work, understanding the key struggles and bottlenecks in it, and then suggesting ways software can help solve those problems. After that, you’ll need to design a solution that involves operations, including building new workflows, design, and of course engineering and code writing.\n* Solving business problems requires a diverse set of skills: product, research, design, and engineering. So you’ll need to collaborate with other team members to fill in any gaps in your experience.\n*  You’ll also need to rely heavily on the AI tools the company provides, as well as the AI agents you manage, in order to perform some of the job duties where you have less experience.\n* Finally, you’ll need to spend part of your time reviewing code for team members on the development and operations team who have less experience writing code. The goal is to make sure the quality of the code matches the architecture and that the code will not break at scale.\n* Some examples for problems that you will solve: \n\n1. How do you build a scheduling system that accounts for a clinician&#x27;s drive time, patient acuity?\n2. How to build software that reads and responds to faxes?\n3. How to build agents that can pick up phone calls and triage patient issue? \n4.  How do you automate HCC risk adjustment coding in a way clinicians actually trust? \n5. How do you migrate a billing pipeline from one clearinghouse to another without dropping claims mid-flight? These are the kinds of problems on our board right now. Some of them have failed before. We&#x27;re looking for someone who finds that more interesting than intimidating.\n\n### **What We’re Looking For**\n\n* 8+ years of software engineering experience\n* Deep full-stack fluency with modern web technologies (we use React, Remix, Node, TypeScript, Postgres, Prisma — depth of understanding matters more than framework-matching)\n* You&#x27;ve built a personal AI development workflow — configured tooling, custom prompts, sharp instincts for where the models excel and where they&#x27;ll confidently lead you wrong\n* You function as a full owner: you scope the problem, manage the work, write the code, instrument the outcome, and close the loop. We don&#x27;t have dedicated PMs on engineering projects. \n\n### **Especially strong fit if:**\n\n* You&#x27;ve been a founding engineer, tech lead, or staff engineer — someone who set technical direction, made architectural calls without a playbook, and owned the consequences. This matters most to us.\n* Startup experience where wearing many hats wasn&#x27;t a novelty but a necessity — you&#x27;ve context-switched between product thinking, infrastructure, and stakeholder communication in the same week\n* Healthcare technology, EHR integrations, or HIPAA-regulated environments\n* Value-based care, Medicare, or clinical workflow automation experience\n* Systems where correctness really mattered — finance, healthcare, infrastructure\n\n### **Bonus points if you also bring depth in:**\n\n* Mobile development (iOS/Android or React Native)\n* Security engineering\n* Product or design — if you&#x27;ve worn that hat before and liked it, this is a place where that matters\n\n### **Tech Stack**\n\nReact, Remix, TypeScript, Node.js, PostgreSQL, Prisma ORM, Google Cloud Platform. AI tools: Cursor, Claude Code. HIPAA-compliant development environment.\n\n### **Why Pine Park Health**\n\n* **Real impact:** Your code directly affects the quality of care for seniors in 150+ communities\n* **Ownership culture:** You own problems end-to-end and are trusted to make product decisions\n* **AI-native team:** AI tools are central to how we work — your experience is what makes that output production-grade\n* **Career growth:** The product engineering skill set — owning outcomes, stakeholder communication, product decisions with technical depth — is exactly what prepares engineers for VP Eng, founding engineer, and CTO roles\n* **Y Combinator-backed Series B** with a clear growth path\n\n### **Benefits Tailored for You and Your Family**\n\n* Equity in a Y Combinator-backed Series B company with clear growth trajectory\n* Comprehensive medical, vision, and dental insurance for you and your dependents\n* Flexible spending accounts for health and dependent care expenses\n* 401(k) retirement plan to help secure your financial future\n* Generous paid time off:\n* Paid sick leave\n* 8 weeks of paid parental leave for growing families\n* Monthly wellness allowance to support your physical and mental health\n* Professional development funding to advance your technical expertise and career goals\n* Team building through regular social events and offsites\n\n_The compensation package for this role includes competitive base salary, equity, and benefits. The final package for each successful candidate will depend on several job-related factors unique to each candidate, including education, training, skill set, years and depth of experience, business needs, internal peer equity, and alignment with geographic and market data. Our compensation structures are tailored to each geographic zone&#x27;s unique market conditions to ensure all employees receive fair and competitive compensation. Your recruiter will share more about the benefits package during the hiring process._\n\nCompensation Range for Bay Area residents: $190K - $215K\n\n \n\n### **How to Apply**\n\n### **Send us a Cover Letter (required) about a system you built that you&#x27;re proud of—not because it was technically clever, but because it held up over time, solved the right problem, and you made good tradeoff decisions along the way. Tell us how you&#x27;d approach it differently now. We care about your judgment, not your resume.**\n\n_Pine Park Health is an equal opportunity employer. We aim to recruit, hire, develop, compensate, and promote regardless of race, religion, country of origin, gender, sexual orientation, age, marital status, veteran status, or disability._&quot;, &quot;interview_process&quot;: &quot;**Interview Process**\n\nWe believe in a thorough but respectful process. Here&#x27;s what to expect:\n\n**1. Application + Cover Letter (Required)**\\\nSend us a cover letter about a system you built that you&#x27;re proud of — not because it was technically clever, but because it held up over time, solved the right problem, and you made good tradeoff decisions along the way. Tell us how you&#x27;d approach it differently now. We care about your judgment, not your resume.\n\n**2. Recruiter Screen (30 minutes)**\\\nConversation with our recruiting team to discuss your background, what you&#x27;re looking for, and answer initial questions about the role.\n\n**3. Hiring Manager Screen (45 minutes)**\\\nTechnical conversation with Shane, our \\[title\\], to dive into your experience and discuss the problems we&#x27;re solving.\n\n**4. Senior Engineer Interview (45-60 minutes)**\\\nMeet with one of our Senior Engineers to explore technical depth, discuss your development workflow, and talk through your approach to product engineering.\n\n**5. On-Site Simulation (2-3 hours)**\\\nVisit our Berkeley office for a scenario-based interview. You&#x27;ll work through a real product problem with the team — think through the user need, design a solution, and discuss trade-offs. This is conversational, not a whiteboard coding exercise.\n\n**6. CEO Conversation (30-45 minutes)**\\\nFinal conversation with George, our CEO, to discuss vision, culture fit, and answer any remaining questions you have about Pine Park Health.\n\n**Timeline:** The entire process typically takes 3-5 weeks from application to offer.&quot;}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D93346&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=1965&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/pine-park-health&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/companies&quot;, &quot;customQuestions&quot;: []}, &quot;url&quot;: &quot;/companies/pine-park-health/jobs/wx8rhlj-senior-software-engineer&quot;, &quot;version&quot;: &quot;9fcde557260d98482e73fb068322d8b3020a10b3&quot;, &quot;encryptHistory&quot;: false, &quot;clearHistory&quot;: false, &quot;id&quot;: &quot;WaasShowJobPage-react-component-db9f0d93-e051-4820-8b53-879d5ef26d3e&quot;, &quot;server_side&quot;: true}"></div>
