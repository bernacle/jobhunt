47, &quot;title&quot;: &quot;Sales Enrollment Director &quot;, &quot;url&quot;: &quot;/companies/pine-park-health/jobs/EnkhUNH-sales-enrollment-director&quot;, &quot;applyUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D93347&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=1965&quot;, &quot;location&quot;: &quot;San Rafael, CA, US / Novato, CA, US / San Francisco, CA, US / Petaluma, CA, US / Sausalito, CA, US / Santa Rosa, CA, US&quot;, &quot;askUs&quot;: true, &quot;type&quot;: &quot;Full-time&quot;, &quot;role&quot;: &quot;sales&quot;, &quot;roleSpecificType&quot;: null, &quot;prettyRole&quot;: &quot;Sales&quot;, &quot;salaryRange&quot;: &quot;$110K - $140K&quot;, &quot;equityRange&quot;: &quot;&quot;, &quot;minExperience&quot;: &quot;1+ years&quot;, &quot;minSchoolYear&quot;: null, &quot;visa&quot;: &quot;US citizen/visa only&quot;, &quot;skills&quot;: [], &quot;isIncomplete&quot;: false, &quot;companyUrl&quot;: &quot;/companies/pine-park-health&quot;, &quot;companyLogoUrl&quot;: &quot;https://bookface-images.s3.amazonaws.com/small_logos/3facf7f7379345c5f8e16d3059db45980ba0aa68.png&quot;, &quot;companyName&quot;: &quot;Pine Park Health&quot;, &quot;companyBatchName&quot;: &quot;S18&quot;, &quot;companyOneLiner&quot;: &quot;We provide primary care in senior living communities.&quot;, &quot;hiringManager&quot;: null, &quot;createdAt&quot;: &quot;5 months&quot;, &quot;lastActive&quot;: &quot;4 months&quot;, &quot;description&quot;: &quot;## **About Pine Park Health**\n\nPine Park Health is a value-based primary care practice revolutionizing healthcare for residents of senior living communities across Arizona, California, and Nevada. We empower seniors to get healthy, stay healthy, and lead lives they love through a care model designed with everyone in mind — patients, families, community staff, providers, and payers.\n\nOur innovative approach brings healthcare directly to seniors&#x27; homes, offering prevention, screening, chronic condition management, lab work, and diagnostic testing in the comfort of their apartments. With weekly community visits, our teams provide consistent care while collaborating closely with facility staff to address comprehensive health needs. We&#x27;ve eliminated unnecessary barriers to urgent care through same-day and next-day appointments, helping seniors avoid emergency rooms and hospitalizations.\n\nToday, over 185+ communities trust Pine Park Health, and we&#x27;re rapidly expanding our reach and impact. If you&#x27;re mission-driven and passionate about transforming senior healthcare, this is your opportunity to make a meaningful difference!\n\n## **The Opportunity**\n\nWe are seeking a dynamic **Patient Enrollment Director** in our **San Francisco Bay Area (North Bay)** market to lead patient acquisition efforts within our senior living community partnerships. This role combines healthcare expertise with genuine passion for improving senior care, focusing on building trust-based relationships and educating residents and families about the transformative value of our in-home primary care services. You&#x27;ll play a pivotal role in scaling our proven care model, which has already demonstrated strong product-market fit across all the communities we serve.\n\n## **What you’ll do**\n\n* Build and maintain strong relationships with senior living community leadership teams, serving as primary liaison and presenting our care model to staff, residents, and families\n* Own the complete enrollment process from lead generation through patient onboarding, executing prospecting campaigns, and on-site events to achieve monthly enrollment targets\n* Serve as a trusted advisor by understanding residents&#x27; unique health needs while developing comprehensive growth strategies for each community partner\n* Test and refine outreach strategies while collaborating with Marketing, Product, and Clinical teams to optimize our growth playbook\n* Maintain accurate tracking of all interactions in Salesforce, facilitate smooth patient transitions, and analyze performance metrics to identify growth opportunities\n\n## **What we are looking for**\n\n* **A candidate based in the North Bay (ex. San Rafael, Novato, Santa Rosa, Sausalito)**\n* Bachelor&#x27;s degree or equivalent experience\n* 2-3 years of field-based sales, marketing, or business development experience\n* Proficiency with Salesforce and data analytics platforms\n* Valid driver&#x27;s license with active insurance\n* Strong public speaking and presentation skills\n* Excellent interpersonal and empathetic listening abilities\n* Comfortable with cold outreach via phone and email\n* Achievement-oriented mindset with proven track record of meeting sales targets\n* Ability to work independently in an entrepreneurial environment with minimal supervision\n* Comfortable with rapid change and growth that comes with a scaling startup\n* Experience in senior living, senior health, or healthcare sales is strongly preferred\n* Familiarity with healthcare regulations and senior care industry, preferred\n* Experience with value-based care models is preferred\n\n_The ideal candidate combines entrepreneurial drive with a genuine passion for senior care, finding energy in building relationships with residents and their families while staying motivated by measurable results and a meaningful impact. You&#x27;ll need strong presentation skills and flexibility for frequent travel between partner communities._\n\n**Benefits Tailored for You and Your Family**\n\n* Comprehensive medical, vision, and dental insurance for you and your dependents\n* Flexible spending accounts for health and dependent care expenses\n* 401(k) retirement plan to help secure your financial future\n* Generous paid time off: \n* Paid sick leave\n* 8 weeks of paid parental leave for growing families\n* Travel support with mileage reimbursement for community visits\n* Wellness program stipend to support your physical and mental health\n* Professional development allowance\n* Team building through regular social events and off-sites\n\n_This role offers total compensation of $110,000 - $140,000 annually, which includes a base salary of $75,000-$90,000 plus a commission plan with a target range of $35,000-$50,000. The final compensation package for each successful candidate will depend on several job-related factors unique to each candidate. These factors may include, but are not limited to, education, training, skill set, years and depth of experience, certifications and licensure, business needs, internal peer equity, and alignment with geographic and market data. Our compensation structures and ranges are tailored to the unique market conditions of each geographic zone, ensuring that all employees receive fair and competitive compensation based on their roles and locations. Your recruiter will share more about the benefits package for your role during the hiring process._\n\n \n\n_Pine Park Health is an equal opportunity employer. We aim to recruit, hire, develop, compensate, and promote regardless of race, religion, country of origin, gender, sexual orientation, age, marital status, veteran status, or disability._&quot;, &quot;interview_process&quot;: null}, &quot;relatedJobs&quot;: [], &quot;signupUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D93347&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=1965&quot;, &quot;companyUrl&quot;: &quot;https://www.ycombinator.com/companies/pine-park-health&quot;, &quot;createProfileUrl&quot;: &quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication&amp;defaults%5BsignUpActive%5D=true&quot;, &quot;signedIn&quot;: false, &quot;showDirectApply&quot;: true, &quot;waasDirectoryUrl&quot;: &quot;https://www.workatastartup.com/c
