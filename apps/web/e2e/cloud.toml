# End-to-end tests and local development: the fixture boards in
# fixtures/boards.mjs (served by fixture-server.mjs) plus one recorded real
# board. Read by the real discovery worker.

[logging]
level = "info,sqlx=warn"
format = "text"

[discovery]
concurrency = 4

[verification]
reuse_minutes = 15
fresh_hours = 24
stale_hours = 72

