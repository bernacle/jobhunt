# JobHunt configuration. Every setting is optional; `narrow find` works with
# no config file at all. Copy this file to the path shown by `narrow config`
# (for example ~/Library/Application Support/jobhunt/config.toml on macOS or
# ~/.config/jobhunt/config.toml on Linux), or pass it with --config.

[storage]
# SQLite database file. Relative paths are resolved against this file's
# directory. Default: <platform data dir>/jobhunt/jobhunt.db
# database = "jobhunt.db"

[logging]
# A tracing filter directive. Overridden by -v flags and JOBHUNT_LOG/RUST_LOG.
# The same setting applies to `narrow mcp`, whose logs also go to stderr
# (stdout carries only the MCP protocol).
level = "error"
# "text" or "json" (logs always go to stderr).
format = "text"

[discovery]
# Sources fetched at the same time, and requests to any one host at a time.
concurrency = 8
max_requests_per_host = 4
# Per-request timeout in seconds, and retries for transient HTTP failures.
request_timeout_secs = 30
max_retries = 2
# Boards that support it are asked "has anything changed?" (HTTP ETag) and
# skipped when not; after this many hours they are re-read in full anyway.
revalidate_after_hours = 24
# `narrow find` (and the MCP search_jobs tool) work from stored jobs while
# every source was read within this many hours, and refresh the sources
# first otherwise. `find --refresh` always refreshes; `--offline` never does.
refresh_after_hours = 12

[verification]
# `narrow verify` reuses an attempt this recent instead of asking the
# source again (`--force` always asks).
reuse_minutes = 15
# A successful verification is fresh for this long, and stale (the job is
# not recommended until verified again) after this long.
fresh_hours = 24
stale_hours = 72
# Source records of one job verified at the same time.
concurrency = 4

[cloud]
# JobHunt Cloud server for `narrow login` and `narrow sync` (optional;
# JobHunt works fully offline without it). JOBHUNT_CLOUD_URL overrides it.
# server = "https://jobhunt.example.com"

[ai]
# Optional: a model that reads what you say you're looking for into your
# taste profile. Without it Narrow uses its built-in reader, offline, and
# everything still works. Only your words about what you want, a normalized
# summary of your career (titles, years, kinds of work, domains,
# technologies; no name, contact details, employers or location) and the
# patterns learned from your feedback are sent, and only when you describe
# or reinterpret what you want (never when ranking). See the README.
# provider = "anthropic"          # or "openai": any OpenAI-compatible server
# model = "claude-opus-5-5"       # OpenAI-compatible servers must name one
# base_url = "http://localhost:11434/v1"   # e.g. Ollama
# api_key_env = "ANTHROPIC_API_KEY"        # the variable holding the key
# timeout_secs = 40

# Sources to search. Listing any source here replaces all built-in defaults,
# so this file fully controls what is searched. Each source can set `company`
# to control the displayed company name.

# Ashby boards: https://jobs.ashbyhq.com/<board>
[[sources.ashby]]
board = "linear"
company = "Linear"

[[sources.ashby]]
board = "posthog"
company = "PostHog"

# Greenhouse boards: https://job-boards.greenhouse.io/<board>
# (Greenhouse reports the company name itself.)
[[sources.greenhouse]]
board = "anthropic"

[[sources.greenhouse]]
board = "stripe"

# Lever sites: https://jobs.lever.co/<site>. Use region = "eu" for
# https://jobs.eu.lever.co/<site>.
[[sources.lever]]
site = "spotify"
company = "Spotify"

[[sources.lever]]
site = "qonto"
company = "Qonto"

# Y Combinator companies (Work at a Startup):
# https://www.ycombinator.com/companies/<slug>/jobs
[[sources.yc]]
slug = "posthog"

# A company careers page. JobHunt finds the Ashby, Greenhouse or Lever board
# the page links to or embeds and reads that board, so you don't need to know
# which one the company uses. Pages that only load their jobs with
# JavaScript can't be detected; configure their board directly instead.
[[sources.careers]]
url = "https://www.notion.com/careers"
company = "Notion"
