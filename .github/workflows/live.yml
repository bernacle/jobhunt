# Live source validation: runs the opt-in (#[ignore]) live tests against the
# real Ashby, Greenhouse, Lever and YC endpoints.
#
# This is an early warning that a source changed its payload or went away.
# It is NOT a required check and never runs on pull requests, so an outage,
# rate limit or format change at a third party cannot block development.
# Each family is its own job, so a failure names the family that broke.
#
# Load per run is small: a handful of representative boards per family
# (overridable, see the inputs), one listing request each (plus one request
# per job for YC companies).

name: Live sources

on:
  workflow_dispatch:
    inputs:
      family:
        description: Source family to check
        type: choice
        options: [all, ashby, greenhouse, lever, yc, verification]
        default: all
      instances:
        description: >-
          Optional boards/sites/companies to check instead of the defaults,
          comma-separated (Ashby: one board). Requires a single source family
          (not all or verification).
        type: string
        required: false
  schedule:
    # Mondays, Wednesdays and Fridays at 06:17 UTC.
    - cron: "17 6 * * 1,3,5"

permissions:
  contents: read

concurrency:
  # Never run two live validations at once; don't cancel one in progress.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  live:
    name: live (${{ matrix.family }})
    # Scheduled runs only in the upstream repository, not in forks.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.family != 'verification')
      || (github.event_name != 'workflow_dispatch' && github.repository == 'bernacle/narrow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.family != 'all'
          && format('["{0}"]', inputs.family)
          || '["ashby","greenhouse","lever","yc"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the ${{ matrix.family }} live test
        run: cargo test --locked -p jobhunt-sources --test "${FAMILY}_live" --no-run
        env:
          FAMILY: ${{ matrix.family }}
      - name: Check ${{ matrix.family }} against the live service
        timeout-minutes: 10
        env:
          FAMILY: ${{ matrix.family }}
          REQUESTED: ${{ inputs.family }}
          INSTANCES: ${{ inputs.instances }}
        run: |
          if [[ -n "$INSTANCES" ]]; then
            if [[ "$REQUESTED" == "all" ]]; then
              echo "::error::'instances' needs a single family, not 'all'"
              exit 1
            fi
            case "$FAMILY" in
              ashby) export JOBHUNT_LIVE_ASHBY_BOARD="$INSTANCES" ;;
              greenhouse) export JOBHUNT_LIVE_GREENHOUSE_BOARDS="$INSTANCES" ;;
              lever) export JOBHUNT_LIVE_LEVER_SITES="$INSTANCES" ;;
              yc) export JOBHUNT_LIVE_YC_COMPANIES="$INSTANCES" ;;
            esac
          fi
          cargo test --locked -p jobhunt-sources --test "${FAMILY}_live" -- --ignored --nocapture

  # First-party verification of a few real jobs per family (single-job
  # endpoints, application paths, a job that does not exist), with the
  # location, restriction and compensation facts read from each.
  verification:
    name: live (verification)
    if: >-
      (github.event_name == 'workflow_dispatch'
        && (inputs.family == 'all' || inputs.family == 'verification'))
      || (github.event_name != 'workflow_dispatch' && github.repository == 'bernacle/narrow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the verification live test
        run: cargo test --locked -p jobhunt-eligibility --test verification_live --no-run
      - name: Verify real listings
        timeout-minutes: 10
        # One family at a time, so the output reads per family.
        run: cargo test --locked -p jobhunt-eligibility --test verification_live -- --ignored --nocapture --test-threads 1
