# Required quality gates for pull requests that are ready for review, and
# for every push to main.
#
# Everything here is offline: no job talks to Ashby, Greenhouse, Lever or
# YC, and no job sends email (the web's end-to-end tests serve fixture job
# boards locally and write email to a file). Live source checks run
# separately in live.yml and never block merges.
#
# The job names (fmt, clippy, test, cloud, docs, msrv, web, e2e, ci-passed) are the status
# check names used by branch protection. Renaming a job means updating the
# protection rule (see CONTRIBUTING.md and .github/rulesets/main.json).
#
# `scripts/check.sh` runs the same commands locally; keep the two in sync.
#
# Draft pull requests skip every job, to save Actions minutes while a change
# is still being iterated on. GitHub counts a skipped required check as
# passing, which is acceptable here: a draft cannot be merged, and marking
# it "Ready for review" (the ready_for_review event) runs the whole suite
# for real, replacing the skips. Open PRs as drafts, run scripts/check.sh
# locally while iterating, and mark them ready when done.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request, so a new push cancels the run for the
  # commit it replaces. Pushes to main get one group per commit: every
  # commit that lands on main is verified, none is cancelled.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - name: Check formatting (cargo fmt --all --check)
        run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint (cargo clippy, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # Build and test share one job so the workspace is compiled once.
    name: test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (Cargo.lock must be up to date)
        run: cargo fetch --locked
      - name: Build workspace (all targets)
        run: cargo build --workspace --all-targets --frozen
      # The remaining steps run with an unreachable HTTP(S) proxy, so a test
      # that reaches the internet fails every time instead of depending on
      # a third party. Local mock servers (127.0.0.1) are exempt.
      - name: Unit tests (model, lifecycle, dedupe, SQLite, migrations, config)
        run: cargo test --workspace --frozen --no-fail-fast --lib --bins
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
      - name: Integration tests (fixtures, local HTTP, multi-source end to end)
        run: cargo test --workspace --frozen --no-fail-fast --test '*'
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
      - name: Doc tests
        run: cargo test --workspace --frozen --no-fail-fast --doc
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1

  cloud:
    # The cloud backend against a real PostgreSQL: the storage contract on
    # both backends, multi-user isolation, encryption at rest, sync,
    # distributed leases, the HTTP API, hosted MCP, and the binary's
    # server/worker/migrate modes end to end. The other jobs never start
    # a database; their Postgres tests skip. Here a missing database is a
    # failure (JOBHUNT_REQUIRE_POSTGRES).
    name: cloud
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The major version Railway's Postgres template deploys.
        image: postgres:18
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunt"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      JOBHUNT_TEST_DATABASE_URL: postgres://jobhunt:jobhunt@127.0.0.1:5432/jobhunt
      JOBHUNT_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the cloud tests (Cargo.lock must be up to date)
        run: |
          cargo fetch --locked
          cargo test --frozen --no-run -p jobhunt-storage -p jobhunt-app -p jobhunt-cloud -p jobhunt-cli
      # As in `test`: an unreachable proxy, so nothing reaches the internet
      # (the local Postgres and mock servers are exempt).
      - name: Storage contract (SQLite and Postgres), isolation, encryption, sync, leases
        run: cargo test --frozen --no-fail-fast -p jobhunt-storage --tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
      - name: Sync end to end (two local machines, one cloud account)
        run: cargo test --frozen --no-fail-fast -p jobhunt-app --test sync
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
      - name: HTTP API, authentication and hosted MCP (real HTTP, MCP client)
        run: cargo test --frozen --no-fail-fast -p jobhunt-cloud
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
      - name: Binary end to end (server, migrate, workers, login, sync, offline)
        run: cargo test --frozen --no-fail-fast -p jobhunt-cli --test cloud_e2e
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1

  docs:
    name: docs
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build rustdoc (warnings denied)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Type-checks every target (lib, bin, tests) on the declared minimum
    # Rust version with the committed Cargo.lock. That catches both our own
    # use of newer language/std features and a dependency update that raised
    # its rust-version above ours. Tests run on stable in `test`; running
    # them twice would double CI time for no extra protection.
    name: msrv
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "::error file=Cargo.toml::no workspace rust-version found"
            exit 1
          fi
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
          rustup default "${{ steps.msrv.outputs.version }}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check workspace on MSRV (cargo check --all-targets)
        run: cargo check --workspace --all-targets --locked

  web:
    # The web app on its own: its TypeScript types match the committed API
    # schema (which the Rust `test` job checks against the server's types),
    # type-check, lint, component tests (with automated accessibility
    # checks), and a production build.
    name: web
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: API types match the schema (npm run types:check)
        run: npm run types:check
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    # The product loop in a real browser against the real stack: Postgres,
    # `jobhunt migrate`, the discovery, verification and notification
    # workers, `jobhunt server`, and the built web app, with fixture job
    # boards served locally and email written to a file. Only the binary is
    # compiled here (the Rust suites run in `test` and `cloud`).
    name: e2e
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunt"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      JOBHUNT_E2E_DATABASE_URL: postgres://jobhunt:jobhunt@127.0.0.1:5432/jobhunt
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the jobhunt binary
        run: cargo build --locked -p jobhunt-cli
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the web app
        working-directory: apps/web
        run: npm run build
      - name: End-to-end tests (desktop and mobile)
        working-directory: apps/web
        run: npx playwright test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  ci-passed:
    # A single check that is green only when every job above succeeded.
    # Require this one (or all of the above) in branch protection.
    # always() so a failed or cancelled job still reports here; skipped on
    # drafts like the rest (otherwise the skipped jobs would fail it).
    name: ci-passed
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [fmt, clippy, test, cloud, docs, msrv, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [[ -n "$failed" ]]; then
            echo "::error::required jobs did not succeed: $failed"
            exit 1
          fi
