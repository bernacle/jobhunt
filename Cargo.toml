[workspace]
resolver = "3"
members = [
    "crates/jobhunt-app",
    "crates/jobhunt-core",
    "crates/jobhunt-eligibility",
    "crates/jobhunt-jobs",
    "crates/jobhunt-profile",
    "crates/jobhunt-ranking",
    "crates/jobhunt-resume",
    "crates/jobhunt-sources",
    "crates/jobhunt-storage",
    "crates/jobhunt-cli",
    "crates/jobhunt-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
jobhunt-app = { path = "crates/jobhunt-app" }
jobhunt-core = { path = "crates/jobhunt-core" }
jobhunt-eligibility = { path = "crates/jobhunt-eligibility" }
jobhunt-jobs = { path = "crates/jobhunt-jobs" }
jobhunt-profile = { path = "crates/jobhunt-profile" }
jobhunt-mcp = { path = "crates/jobhunt-mcp" }
jobhunt-ranking = { path = "crates/jobhunt-ranking" }
jobhunt-resume = { path = "crates/jobhunt-resume" }
jobhunt-sources = { path = "crates/jobhunt-sources" }
jobhunt-storage = { path = "crates/jobhunt-storage" }

# External crates
aes-gcm = "0.10"
anstream = "1"
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
pdf-extract = "0.12.1"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
